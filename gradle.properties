# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment mappings -- top-level properties in NeoGradle 7.1.x (there is
# no `parchment {}` block inside a `neoForge {}` extension anymore, since
# that whole extension no longer exists).
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# Minecraft / NeoForge versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.233
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Create + Create Big Cannons + Ritchie's Projectile Library
# (all real, confirmed-published versions -- see build.gradle for the repos
# they resolve from)
#
# create_version: CBC 5.11.7's own neoforge.mods.toml requires Create in
#   range [6.0.7,6.1.0) -- 6.0.10-223 is a real published build inside
#   that range (com.simibubi.create:create-1.21.1:6.0.10-223:slim on
#   maven.createmod.net).
# rpl_version: CBC 5.11.7 requires Ritchie's Projectile Library >= 2.1.2
#   (com.rbasamoyai:ritchiesprojectilelib on maven.realrobotix.me).
create_version=6.0.10-280
create_big_cannons_version=5.11.7
rpl_version=2.1.2

# Mod metadata
mod_id=colorcannons
mod_name=Color Autocannons
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.example.colorcannons
mod_authors=You
mod_description=Blue/Red Star-Wars-style Autocannon variants and an FE-powered Fixed Cannon Mount for Create Big Cannons.

ponder_version=1.0.82
registrate_version=MC1.21-1.3.0+67

catnip_version=0.8.54
flywheel_version=1.0.6